name: Test acloud-github-runner

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ── 1. Provision the ephemeral runner ───────────────────────────────────────
  start-runner:
    name: Start ephemeral runner
    runs-on: ubuntu-latest
    permissions:
      administration: write
    outputs:
      label:        ${{ steps.runner.outputs.label }}
      server_id:    ${{ steps.runner.outputs.server_id }}
      project_id:   ${{ steps.runner.outputs.project_id }}
      boot_disk_id: ${{ steps.runner.outputs.boot_disk_id }}
    steps:
      - uses: Arubacloud/acloud-github-runner@main
        id: runner
        with:
          mode:                 create
          github_token:         ${{ github.token }}
          acloud_client_id:     ${{ secrets.ACLOUD_CLIENT_ID }}
          acloud_client_secret: ${{ secrets.ACLOUD_CLIENT_SECRET }}
          acloud_project_id:    68398923fb2cb026400d4d31
          vpc_uri:              /projects/68398923fb2cb026400d4d31/providers/Aruba.Network/vpcs/69ef350e3357d3fb8d3bcfb2
          subnet_uri:           /projects/68398923fb2cb026400d4d31/providers/Aruba.Network/vpcs/69ef350e3357d3fb8d3bcfb2/subnets/69ef351d3357d3fb8d3bcfc1
          security_group_uri:   /projects/68398923fb2cb026400d4d31/providers/Aruba.Network/vpcs/69ef350e3357d3fb8d3bcfb2/securityGroups/69ef351d3357d3fb8d3bcfc4
          keypair_uri:          /projects/68398923fb2cb026400d4d31/providers/Aruba.Compute/keyPairs/69007ebf4e7d691466d8621e
          flavor:               CSO4A8   # 4 vCPU / 8 GB RAM
          image:                LU22-001 # Ubuntu 22.04 LTS

  # ── 2. Smoke test — runs on the ephemeral Aruba Cloud server ────────────────
  smoke-test:
    name: Smoke test
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    steps:
      - name: Verify runner identity
        run: |
          echo "Hostname : $(hostname)"
          echo "User     : $(whoami)"
          echo "Kernel   : $(uname -r)"
          echo "CPUs     : $(nproc)"
          echo "RAM      : $(free -h | awk '/Mem:/{print $2}')"
          echo "Disk     : $(df -h / | awk 'NR==2{print $4}') free"
          echo "✔ Running on Aruba Cloud!"

  # ── 3. Tear down — always runs, even if smoke-test fails ────────────────────
  stop-runner:
    name: Stop ephemeral runner
    needs: [start-runner, smoke-test]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      administration: write
    steps:
      - uses: Arubacloud/acloud-github-runner@main
        with:
          mode:                 delete
          github_token:         ${{ github.token }}
          acloud_client_id:     ${{ secrets.ACLOUD_CLIENT_ID }}
          acloud_client_secret: ${{ secrets.ACLOUD_CLIENT_SECRET }}
          acloud_project_id:    ${{ needs.start-runner.outputs.project_id }}
          server_id:            ${{ needs.start-runner.outputs.server_id }}
          boot_disk_id:         ${{ needs.start-runner.outputs.boot_disk_id }}
